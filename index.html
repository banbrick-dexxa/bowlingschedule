<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bowling Schedule 2026–2027</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --highlight: #22c55e;
      --badge-bg: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem 1rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .meta-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1.25rem;
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.75rem;
    }

    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .meta-item strong {
      color: var(--accent);
    }

    /* Filters & Controls */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.45rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0f172a;
    }

    .view-toggle {
      display: inline-flex;
      background: #090d16;
      border-radius: 8px;
      padding: 4px;
      border: 1px solid var(--card-border);
      align-self: flex-start;
    }

    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.35rem 0.85rem;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .view-btn.active {
      background: var(--card-bg);
      color: var(--accent);
    }

    /* Cards Layout */
    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.25rem;
    }

    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .match-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .week-num {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      background: var(--accent-glow);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    .match-date {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .opponent {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0.35rem 0 1rem;
      color: #fff;
    }

    .bowlers-section {
      margin-top: auto;
      border-top: 1px solid var(--card-border);
      padding-top: 0.75rem;
    }

    .bowlers-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      display: flex;
      justify-content: space-between;
    }

    .roster-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .bowler-chip {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .bowler-chip.selected {
      background: var(--badge-bg);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    .no-lineup {
      color: var(--text-muted);
      font-style: italic;
      font-size: 0.85rem;
    }

    /* Matrix Table Layout */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.88rem;
    }

    th, td {
      padding: 0.75rem 0.65rem;
      border-bottom: 1px solid var(--card-border);
      white-space: nowrap;
    }

    th {
      background: #141d2f;
      color: var(--text-muted);
      font-weight: 600;
    }

    th:first-child, td:first-child {
      text-align: left;
      font-weight: 600;
      padding-left: 1rem;
      position: sticky;
      left: 0;
      background: var(--card-bg);
    }

    th:first-child {
      background: #141d2f;
    }

    td.check {
      color: var(--highlight);
      font-weight: 800;
      font-size: 1.1rem;
    }

    .opponent-row td {
      font-size: 0.75rem;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎳 Bowling Schedule 2026–2027</h1>
      <div class="meta-bar">
        <div class="meta-item">📍 Venue: <strong>The Bowler</strong></div>
        <div class="meta-item">⏰ Warm-up: <strong>6:15 PM</strong></div>
        <div class="meta-item">🎳 Game: <strong>6:30 PM</strong></div>
      </div>
    </header>

    <div class="controls">
      <div class="filter-group" id="filterContainer">
        <!-- Generated by JS -->
      </div>
      <div class="view-toggle">
        <button class="view-btn active" id="btnCards" onclick="switchView('cards')">Cards</button>
        <button class="view-btn" id="btnTable" onclick="switchView('table')">Matrix Table</button>
      </div>
    </div>

    <!-- Cards View -->
    <div class="schedule-grid" id="cardsView"></div>

    <!-- Table View -->
    <div class="table-wrapper" id="tableView" style="display: none;">
      <table id="matrixTable"></table>
    </div>
  </div>

  <script>
    const bowlers = ["John", "Shane", "Jay", "Derek", "Garret", "Travis", "Sean", "Nate"];

    const schedule = [
      { week: 1, date: "23-Sep", opponent: "Starion Bank", bowlers: ["Shane", "Jay", "Derek", "Sean"] },
      { week: 2, date: "30-Sep", opponent: "Tharaldson Ethanol", bowlers: ["John", "Derek", "Garret", "Travis"] },
      { week: 3, date: "7-Oct", opponent: "Twin City Garage Door", bowlers: ["John", "Shane", "Jay", "Sean"] },
      { week: 4, date: "14-Oct", opponent: "Century Builders", bowlers: ["John", "Jay", "Derek", "Travis"] },
      { week: 5, date: "21-Oct", opponent: "Northern", bowlers: ["Shane", "Garret", "Travis", "Sean"] },
      { week: 6, date: "28-Oct", opponent: "Carpet Cal", bowlers: ["John", "Shane", "Jay", "Garret"] },
      { week: 7, date: "4-Nov", opponent: "Gizmonic Institute", bowlers: ["John", "Derek", "Garret", "Sean"] },
      { week: 8, date: "11-Nov", opponent: "Brickhouse", bowlers: ["John", "Jay", "Garret", "Travis"] },
      { week: 9, date: "18-Nov", opponent: "JT Lawn & Landscaping", bowlers: ["Shane", "Derek", "Travis", "Sean"] },
      { week: 10, date: "25-Nov", opponent: "Brookdale Spirits", bowlers: [] }
    ];

    let selectedBowler = "ALL";

    function initFilters() {
      const container = document.getElementById("filterContainer");
      const list = ["ALL", ...bowlers];

      list.forEach(name => {
        const btn = document.createElement("button");
        btn.className = `filter-btn ${name === "ALL" ? "active" : ""}`;
        btn.textContent = name === "ALL" ? "All Bowlers" : name;
        btn.onclick = () => {
          document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          selectedBowler = name;
          renderCards();
        };
        container.appendChild(btn);
      });
    }

    function renderCards() {
      const container = document.getElementById("cardsView");
      container.innerHTML = "";

      schedule.forEach(item => {
        const isBenched = selectedBowler !== "ALL" && !item.bowlers.includes(selectedBowler);
        
        const card = document.createElement("div");
        card.className = "match-card";
        if (isBenched) {
          card.style.opacity = "0.35";
        }

        const rosterHtml = item.bowlers.length > 0 
          ? item.bowlers.map(b => `<span class="bowler-chip ${b === selectedBowler ? 'selected' : ''}">${b}</span>`).join("")
          : `<span class="no-lineup">Lineup TBD / Off Week</span>`;

        card.innerHTML = `
          <div class="card-top">
            <span class="week-num">Week ${item.week}</span>
            <span class="match-date">${item.date}</span>
          </div>
          <div class="opponent">vs. ${item.opponent}</div>
          <div class="bowlers-section">
            <div class="bowlers-label">
              <span>Roster (${item.bowlers.length})</span>
            </div>
            <div class="roster-tags">${rosterHtml}</div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function renderTable() {
      const table = document.getElementById("matrixTable");
      
      let html = "<thead><tr><th>Bowler</th>";
      schedule.forEach(s => {
        html += `<th>W${s.week}<br><small style="color:var(--text-muted)">${s.date}</small></th>`;
      });
      html += "</tr></thead><tbody>";

      bowlers.forEach(name => {
        html += `<tr><td>${name}</td>`;
        schedule.forEach(s => {
          const plays = s.bowlers.includes(name);
          html += `<td class="${plays ? 'check' : ''}">${plays ? '✓' : '—'}</td>`;
        });
        html += "</tr>";
      });

      // Opponent row
      html += "<tr class=\"opponent-row\"><td><strong>Opponent</strong></td>";
      schedule.forEach(s => {
        html += `<td>${s.opponent}</td>`;
      });
      html += "</tr>";

      html += "</tbody>";
      table.innerHTML = html;
    }

    function switchView(view) {
      const cards = document.getElementById("cardsView");
      const table = document.getElementById("tableView");
      const btnCards = document.getElementById("btnCards");
      const btnTable = document.getElementById("btnTable");

      if (view === "cards") {
        cards.style.display = "grid";
        table.style.display = "none";
        btnCards.classList.add("active");
        btnTable.classList.remove("active");
      } else {
        cards.style.display = "none";
        table.style.display = "block";
        btnCards.classList.remove("active");
        btnTable.classList.add("active");
      }
    }

    initFilters();
    renderCards();
    renderTable();
  </script>
</body>
</html>
